<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caixinha">
<meta name="description" content="Rotina diária com sistema de penalidade financeira — treino, estudo (Gran Cursos), alimentação e organização de fim de semana.">
<title>Caixinha de Castigo — Rotina da Lê</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<style>
:root{
  --bg:#0A0A0B; --bg-elevated:#131315; --surface:#17171A; --surface-2:#1F1F23; --surface-3:#28282C;
  --border:#2C2C31; --border-soft:rgba(255,255,255,.07);
  --text:#F5F5F7; --text-dim:#B8B8BF; --muted:#87878F;
  --accent:#F0A500; --accent-hi:#FFC94D; --accent-soft:rgba(240,165,0,.14); --accent-border:rgba(240,165,0,.38); --accent-text:#1A1300;
  --danger:#E74C3C; --danger-soft:rgba(231,76,60,.14); --danger-border:rgba(231,76,60,.38);
  --success:#2ECC71; --success-soft:rgba(46,204,113,.14); --success-border:rgba(46,204,113,.38);
  --radius-sm:10px; --radius-md:14px; --radius-lg:20px;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 28px -14px rgba(0,0,0,.65);
  --shadow-pop:0 24px 60px -20px rgba(0,0,0,.75);
  --font:-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:radial-gradient(900px 480px at 50% -12%,rgba(240,165,0,.07),transparent 60%),var(--bg);
  color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;}
@media (min-width:520px){
  body{display:flex;justify-content:center;}
  #app{border-left:1px solid var(--border-soft);border-right:1px solid var(--border-soft);box-shadow:var(--shadow-pop);}
}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(19,19,21,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-icon{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,var(--accent-soft),transparent);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.topbar-title{font-weight:800;font-size:14.5px;letter-spacing:-.1px;line-height:1.25;}
.topbar-sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;}
.topbar-saldo{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:8px 13px;border-radius:20px;cursor:pointer;border:1px solid var(--accent-border);transition:transform .15s;}
.topbar-saldo:active{transform:scale(.94);}
.tab-content{flex:1;overflow-y:auto;padding:16px 0 100px;animation:fadeIn .25s ease;}
.tab-content::-webkit-scrollbar{width:6px;}
.tab-content::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-elevated));border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:18px;margin:0 16px 14px;box-shadow:var(--shadow-card);}
.card p{margin:0 0 10px;line-height:1.55;color:var(--text-dim);font-size:13.5px;}
.card p:last-child{margin-bottom:0;}
.card p strong{color:var(--text);}
.card.hero{background:linear-gradient(135deg,rgba(240,165,0,.11),var(--surface) 65%);border-color:var(--accent-border);position:relative;overflow:hidden;}
.card.hero::before{content:"";position:absolute;top:-45%;right:-15%;width:190px;height:190px;background:radial-gradient(circle,rgba(240,165,0,.2),transparent 70%);pointer-events:none;}
.hero-date{font-size:19px;font-weight:800;letter-spacing:-.2px;position:relative;}
.hero-tag{margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:600;position:relative;}
.msg-banner{margin:0 16px 14px;padding:13px 15px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border-soft);border-left:3px solid var(--accent);font-size:13.5px;color:#EAD9AE;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.msg-banner::before{content:"🐯";font-size:15px;flex-shrink:0;line-height:1.4;}
.coach-banner{margin:0 16px 14px;padding:14px 16px;border-radius:var(--radius-md);background:linear-gradient(135deg,rgba(231,76,60,.16),var(--surface-2));border:1px solid var(--danger-border);}
.coach-banner-title{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--danger);text-transform:uppercase;margin-bottom:8px;}
.coach-item{font-size:13.5px;font-weight:700;color:#fff;line-height:1.5;padding:7px 0 7px 16px;border-bottom:1px solid rgba(255,255,255,.08);position:relative;}
.coach-item:last-child{border-bottom:none;}
.coach-item::before{content:"▸";color:var(--danger);position:absolute;left:0;top:7px;}
.section-title{font-size:12.5px;font-weight:800;margin-bottom:14px;letter-spacing:.4px;color:var(--text);text-transform:uppercase;opacity:.9;}
.item-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.item-row:last-child{border-bottom:none;}
.item-info{display:flex;flex-direction:column;gap:5px;}
.item-label{font-size:14.5px;font-weight:700;letter-spacing:-.1px;}
.item-time{font-size:11px;color:var(--muted);font-weight:600;}
.exercicio{border-bottom:1px solid var(--border-soft);}
.exercicio:last-of-type{border-bottom:none;}
.exercicio summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none;}
.exercicio summary::-webkit-details-marker{display:none;}
.exercicio summary::after{content:"›";font-size:18px;color:var(--muted);transform:rotate(90deg);transition:transform .2s;flex-shrink:0;}
.exercicio[open] summary::after{transform:rotate(270deg);}
.exercicio summary .item-label{font-size:14.5px;font-weight:700;}
.exercicio summary .item-time{text-align:right;}
.como-fazer{margin:0 0 12px;font-size:12.5px;color:var(--text-dim);line-height:1.55;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;}
.treino-modo{display:flex;gap:8px;margin-bottom:14px;}
.modo-btn{flex:1;border:1px solid var(--border-soft);background:var(--surface-2);color:var(--muted);font-size:11.5px;font-weight:700;padding:10px 4px;border-radius:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.modo-btn.ativo{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-border);}
.treino-ilustracao{display:block;width:100%;height:auto;border-radius:16px;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:20px;width:fit-content;letter-spacing:.2px;border:1px solid transparent;}
.pill-ok{background:var(--success-soft);color:var(--success);border-color:var(--success-border);}
.pill-bad{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-border);}
.pill-pending{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border-soft);}
.segmented{display:flex;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:3px;gap:2px;flex-shrink:0;}
.seg-btn{border:none;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.seg-btn:active{transform:scale(.94);}
.seg-btn.on-ok{background:var(--success);color:#04240f;}
.seg-btn.on-bad{background:var(--danger);color:#3a0a05;}
.btn{border-radius:11px;border:1px solid var(--border-soft);background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:700;padding:10px 14px;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .15s;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(145deg,var(--accent-hi),var(--accent));color:var(--accent-text);border-color:var(--accent);box-shadow:0 4px 16px -4px rgba(240,165,0,.5);}
.btn-success{background:var(--success-soft);color:var(--success);border-color:var(--success-border);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-border);}
.btn-secondary{background:transparent;color:var(--text-dim);border-color:var(--border-soft);}
.btn-block{width:100%;padding:13px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-ghost-row{display:flex;gap:8px;}
.progress{height:10px;border-radius:20px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border-soft);}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-fill.bad{background:linear-gradient(90deg,#c0392b,var(--danger));}
.progress-fill.good{background:linear-gradient(90deg,#27ae60,var(--success));}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--text-dim);font-weight:600;}
label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--text);border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-soft);}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;}
textarea{resize:vertical;min-height:48px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.stat-row{display:flex;gap:10px;}
.stat-box{flex:1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:12px 8px;text-align:center;}
.stat-box .num{font-size:16.5px;font-weight:800;letter-spacing:-.2px;}
.stat-box .lbl{font-size:10px;color:var(--muted);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.hero-saldo{text-align:center;padding:8px 0 16px;}
.hero-saldo .valor{font-size:36px;font-weight:800;color:var(--accent);letter-spacing:-.5px;}
.hero-saldo .sub{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.divider{height:1px;background:var(--border-soft);margin:14px 0;}
.despesa-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border-soft);gap:10px;}
.despesa-item:last-child{border-bottom:none;}
.despesa-info{font-size:13.5px;font-weight:600;}
.despesa-cat{color:var(--muted);font-size:10.5px;margin-top:2px;font-weight:600;}
.bar-row{margin-bottom:14px;}
.bar-row:last-child{margin-bottom:0;}
.bar-row .barrow-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;font-weight:600;color:var(--text-dim);}
.checklist-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.checklist-item:last-child{border-bottom:none;}
.checkbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:800;cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);}
.checkbox.checked{background:linear-gradient(145deg,#3ddb85,var(--success));border-color:var(--success);color:#04240f;transform:scale(1.05);box-shadow:0 3px 12px -3px rgba(46,204,113,.55);}
.checklist-label{flex:1;font-size:14px;font-weight:600;color:var(--text-dim);}
.checklist-label.penalized{color:var(--text);}
.checklist-label.penalized::after{content:" · multa R$10";font-size:10px;color:var(--muted);font-weight:600;}
.banner-warn{margin:0 16px 14px;padding:13px 15px;border-radius:var(--radius-md);background:var(--danger-soft);border:1px solid var(--danger-border);font-size:13px;color:#F5B8AE;line-height:1.5;font-weight:500;}
.bottomnav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:rgba(19,19,21,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border-soft);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -10px 26px rgba(0,0,0,.4);}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px 2px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;}
.navbtn .ic-wrap{width:36px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s,transform .2s;}
.navbtn .ic{font-size:18px;line-height:1;}
.navbtn.active{color:var(--accent);}
.navbtn.active .ic-wrap{background:var(--accent-soft);transform:translateY(-1px);}
#toast-root{position:fixed;left:0;right:0;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;padding:0 16px;}
.toast{pointer-events:auto;max-width:420px;width:100%;background:var(--surface-2);border:1px solid var(--accent-border);border-radius:var(--radius-md);padding:12px 14px;opacity:0;transform:translateY(14px) scale(.97);transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow-pop);display:flex;gap:10px;align-items:flex-start;}
.toast.show{opacity:1;transform:translateY(0) scale(1);}
.toast-icon{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.toast-body{flex:1;min-width:0;}
.toast-valor{font-weight:800;color:var(--accent);font-size:13px;}
.toast-msg{font-size:12px;color:var(--text-dim);margin-top:2px;line-height:1.4;}
#modal-root:empty{display:none;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .2s ease;}
.modal-card{background:linear-gradient(180deg,var(--surface),var(--bg-elevated));border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:0;width:min(420px,100%);max-height:82vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);animation:modalIn .25s cubic-bezier(.34,1.56,.64,1);}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-soft);flex-shrink:0;gap:12px;}
.modal-header h3{margin:0;font-size:16px;font-weight:800;line-height:1.3;}
.modal-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--border-soft);background:var(--surface-2);color:var(--muted);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-close:active{transform:scale(.92);}
.modal-body{padding:20px;overflow-y:auto;}
.modal-list{padding-left:0;margin:10px 0;font-size:13px;list-style:none;}
.modal-list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);color:var(--text-dim);}
.modal-list li:last-child{border-bottom:none;}
.modal-list li strong{color:var(--text);flex-shrink:0;}
.modal-total{font-size:13.5px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
.modal-actions .btn{flex:1;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5;}
.empty-state{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px;line-height:1.6;}
.badge-fire{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-border);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800;margin-bottom:4px;}
.badge-streak{display:inline-flex;align-items:center;gap:5px;background:var(--success-soft);color:var(--success);border:1px solid var(--success-border);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800;margin-bottom:4px;margin-right:6px;}
.peso-form{display:flex;gap:8px;}
.peso-form input{flex:1;}
.peso-chart{width:100%;height:auto;display:block;}
.fixo-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.fixo-item:last-of-type{border-bottom:none;}
.fixo-info{flex:1;min-width:0;}
.fixo-valor-input{width:84px;flex-shrink:0;text-align:right;padding:8px 9px;}
.fixo-del{flex-shrink:0;padding:8px 10px;}
.fixo-form{display:flex;gap:8px;margin-top:10px;}
.fixo-form input[name="nome"]{flex:1;}
.fixo-form input[name="valor"]{width:84px;flex-shrink:0;}
.conquistas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.conquista{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:12px 6px;text-align:center;opacity:.45;}
.conquista.desbloqueada{opacity:1;border-color:var(--accent-border);background:var(--accent-soft);}
.conquista-icon{font-size:22px;margin-bottom:4px;}
.conquista-nome{font-size:9.5px;font-weight:700;color:var(--text-dim);line-height:1.3;}
.comparativo-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.comparativo-row:last-child{border-bottom:none;}
</style>

<body>
<div id="app"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script>
/* ---------- estado ---------- */
const STORAGE_KEY = 'caixinhaCastigoState_v1';

function defaultState(){
  return {
    version:1,
    config:{ contestDate:null, caixinhaDestino:'Taxa de inscrição do próximo concurso — UFAL/IFAL', metaEconomiaMensal:0, notificacoesAtivas:false },
    days:{},
    weekends:{},
    caixinha:{ historicoQuitacoes:[] },
    financas:{ gastos:[] },
    peso:{ historico:[] },
    gastosFixos:{ itens:[], seeded:false },
    estudos:{ topicos:[], ciclos:0, totalConcluidosHistorico:0 },
    questoesDiario:{},
    treinoCargas:{},
    appStartDate:null,
    weeklySummaryLastShownWeek:null,
    lastEvaluatedDate:null
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return Object.assign(base, parsed, {
      config: Object.assign(base.config, parsed.config||{}),
      caixinha: Object.assign(base.caixinha, parsed.caixinha||{}),
      financas: Object.assign(base.financas, parsed.financas||{}),
      peso: Object.assign(base.peso, parsed.peso||{}),
      gastosFixos: Object.assign(base.gastosFixos, parsed.gastosFixos||{}),
      estudos: Object.assign(base.estudos, parsed.estudos||{}),
      questoesDiario: parsed.questoesDiario||{},
      treinoCargas: parsed.treinoCargas||{},
      days: parsed.days||{},
      weekends: parsed.weekends||{}
    });
  }catch(e){ return defaultState(); }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = defaultState();
let activeTab = 'hoje';
let deferredInstallPrompt = null;

/* ---------- utilidades de data ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function parseDateLocal(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function addDays(s,n){ const d=parseDateLocal(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function dayOfWeek(s){ return parseDateLocal(s).getDay(); }
function isWeekday(s){ const dow=dayOfWeek(s); return dow>=1 && dow<=5; }
function mondayOf(dateObj){ const dow=dateObj.getDay(); const diff=(dow===0?-6:1-dow); const m=new Date(dateObj); m.setDate(dateObj.getDate()+diff); m.setHours(0,0,0,0); return m; }
function saturdayKeyFor(s){ const mon=mondayOf(parseDateLocal(s)); const sat=new Date(mon); sat.setDate(mon.getDate()+5); return fmtDate(sat); }
function todayStr(){ return fmtDate(new Date()); }
function nowHM(){ const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function diffDays(a,b){ return Math.round((parseDateLocal(a)-parseDateLocal(b))/86400000); }
function brl(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function formatBR(s){ return capitalize(new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long'}).format(parseDateLocal(s))); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }

function computeTreinoContagem(){
  let count = 0;
  Object.values(state.days).forEach(d=>{ if(d.items && d.items.treino==='feito') count++; });
  Object.values(state.weekends).forEach(w=>{ if(w.treino==='feito') count++; });
  return count;
}
function currentTreinoNivel(){
  const count = computeTreinoContagem();
  let nivel = TREINO_NIVEIS[0];
  TREINO_NIVEIS.forEach(n=>{ if(count>=n.min) nivel=n; });
  return { nivel, count };
}
function registrarCarga(nomeExercicio, valor){
  if(!valor || valor<=0) return;
  if(!state.treinoCargas[nomeExercicio]) state.treinoCargas[nomeExercicio] = [];
  state.treinoCargas[nomeExercicio].push({ data:todayStr(), valor:Number(valor) });
  save(); render();
}
function getCargaInfo(nomeExercicio){
  const historico = state.treinoCargas[nomeExercicio];
  if(!historico || !historico.length) return null;
  const ultima = historico[historico.length-1];
  const anterior = historico.length>1 ? historico[historico.length-2] : null;
  return { ultima, delta: anterior ? ultima.valor-anterior.valor : null };
}
function computeCorrelacaoPesoTreino(){
  const fimJanela = todayStr();
  const inicioJanela = addDays(fimJanela,-28);
  let treinoOk=0, treinoTot=0;
  let cursor = inicioJanela;
  while(cursor<=fimJanela){
    if(isWeekday(cursor)){
      treinoTot++;
      if(state.days[cursor] && state.days[cursor].items.treino==='feito') treinoOk++;
    } else if(dayOfWeek(cursor)===6){
      treinoTot++;
      if(state.weekends[cursor] && state.weekends[cursor].treino==='feito') treinoOk++;
    }
    cursor = addDays(cursor,1);
  }
  const pesosNaJanela = state.peso.historico.filter(h=>h.data>=inicioJanela && h.data<=fimJanela).sort((a,b)=>a.data.localeCompare(b.data));
  const variacaoPeso = pesosNaJanela.length>=2 ? (pesosNaJanela[pesosNaJanela.length-1].valor - pesosNaJanela[0].valor) : null;
  const freqPct = treinoTot>0 ? Math.round((treinoOk/treinoTot)*100) : 0;
  return { freqPct, variacaoPeso };
}

const NOME_USUARIA = 'Letícia';
function getCoachDirectives(){
  const today = todayStr();
  const hm = nowHM();
  const directives = [];
  const check = (time, done, msg) => { if(hm>=time && !done) directives.push(msg); };

  check('21:00', getQuestoesHoje(today).total>=QUESTOES_META, `${NOME_USUARIA}, você precisa responder as ${QUESTOES_META} questões do dia.`);
  if(state.estudos.topicos.some(t=>!t.concluido)){
    check('20:00', estudouTopicoHoje(), `${NOME_USUARIA}, você precisa estudar pelo menos um tópico do edital hoje.`);
  }
  const diaDoMes = Number(today.slice(8,10));
  if(diaDoMes>=25){
    const totalFixo = state.gastosFixos.itens.reduce((s,i)=>s+i.valor,0);
    const totalPago = state.gastosFixos.itens.filter(i=>isFixoPagoEsteMes(i.id)).reduce((s,i)=>s+i.valor,0);
    if(totalFixo>totalPago){
      check('00:00', false, `${NOME_USUARIA}, você tem ${brl(totalFixo-totalPago)} em contas fixas não pagas este mês. O mês tá acabando.`);
    }
  }

  if(isWeekday(today)){
    const day = ensureWeekdayDay(today);
    const aguaPct = Math.min(100, Math.round((day.agua.ml/AGUA_META)*100));
    check('05:30', day.items.treino==='feito', `${NOME_USUARIA}, você precisa treinar agora.`);
    check('08:00', day.refeicoes.ref1.status==='feito', `${NOME_USUARIA}, você precisa registrar o café da manhã.`);
    check('09:30', !!day.items.trabalhoInicio, `${NOME_USUARIA}, você precisa começar o trabalho.`);
    check('12:00', day.refeicoes.ref2.status==='feito', `${NOME_USUARIA}, você precisa registrar o almoço.`);
    check('18:00', day.refeicoes.ref3.status==='feito', `${NOME_USUARIA}, você precisa registrar o jantar.`);
    check('18:00', aguaPct>=70, `${NOME_USUARIA}, você precisa beber mais água — ainda não bateu 70% da meta.`);
    check('18:30', day.items.estudo1==='feito', `${NOME_USUARIA}, você precisa fazer o bloco de estudo 1.`);
    check('19:30', day.items.estudo2==='feito', `${NOME_USUARIA}, você precisa fazer o bloco de estudo 2.`);
    check('20:30', day.items.estudo3==='feito', `${NOME_USUARIA}, você precisa fazer o bloco de estudo 3.`);
    check('22:00', day.items.checkinFimDiaFeito, `${NOME_USUARIA}, você precisa fazer o check-in de fim de dia.`);
  } else if(dayOfWeek(today)===6){
    const wk = ensureWeekend(today);
    check('12:00', wk.treino==='feito', `${NOME_USUARIA}, você precisa treinar hoje.`);
    check('14:00', wk.items.quentinhas, `${NOME_USUARIA}, você precisa preparar as quentinhas da semana.`);
    check('14:00', wk.items.mercado, `${NOME_USUARIA}, você precisa fazer o mercado.`);
    check('16:00', wk.items.faxina, `${NOME_USUARIA}, você precisa fazer a faxina.`);
  } else {
    const satKey = saturdayKeyFor(today);
    const wk = ensureWeekend(satKey);
    check('12:00', wk.items.quentinhas, `${NOME_USUARIA}, você precisa preparar as quentinhas da semana.`);
    check('12:00', wk.items.mercado, `${NOME_USUARIA}, você precisa fazer o mercado.`);
    check('14:00', wk.items.faxina, `${NOME_USUARIA}, você precisa fazer a faxina.`);
    check('19:00', wk.items.agenda, `${NOME_USUARIA}, você precisa organizar a agenda da semana.`);
  }
  return directives;
}

function isModoConcurso(dateStr){
  if(!state.config.contestDate) return false;
  const diff = diffDays(state.config.contestDate, dateStr);
  return diff>=0 && diff<=30;
}
function studyPenaltyValue(dateStr){ return isModoConcurso(dateStr) ? 20 : 10; }

/* ---------- fábricas de estado ---------- */
function ensureWeekdayDay(dateStr){
  if(!state.days[dateStr]){
    state.days[dateStr] = {
      date:dateStr, type:'weekday',
      items:{ treino:'pendente', tipoTreino:'academia', estudo1:'pendente', estudo2:'pendente', estudo3:'pendente', trabalhoInicio:null, checkinFimDiaFeito:false },
      refeicoes:{ ref1:{status:'pendente',obs:''}, ref2:{status:'pendente',obs:''}, ref3:{status:'pendente',obs:''} },
      agua:{ ml:0 },
      finalizado:false
    };
  }
  return state.days[dateStr];
}
function ensureWeekend(satKey){
  if(!state.weekends[satKey]){
    state.weekends[satKey] = {
      key:satKey,
      items:{ faxina:false, roupas:false, quentinhas:false, mercado:false, agenda:false, treinoPrep:false, financeiro:false, peso:false },
      treino:'pendente', tipoTreino:'academia',
      finalizado:false
    };
  }
  return state.weekends[satKey];
}

function setTag(tag, valor, nota, dataStr, categoria, origem){
  state.financas.gastos = state.financas.gastos.filter(g=>g.tag!==tag);
  if(valor>0){
    state.financas.gastos.push({ id:uid(), tag, categoria:categoria||'caixinha', valor, nota, data:dataStr, origem:origem||tag.split(':')[1] });
  }
}

  } else { setTag(tag,0,'',dateStr); }
  save(); render();
}
function getQuestoesHoje(dateStr){
  const v = state.questoesDiario[dateStr];
  if(!v) return { total:0, acertos:0 };
  if(typeof v === 'number') return { total:v, acertos:0 };
  return v;
}
function registrarRodadaQuestoes(dateStr, totalIncremento, acertosIncremento){
  const atual = getQuestoesHoje(dateStr);
  const total = Math.max(0, atual.total + (Number(totalIncremento)||0));
  const acertos = Math.max(0, Math.min(total, atual.acertos + (Number(acertosIncremento)||0)));
  state.questoesDiario[dateStr] = { total, acertos };
  save(); render();
}
function computeAcertoMedioMes(yyyymm){
  const dias = Object.keys(state.questoesDiario).filter(d=>d.startsWith(yyyymm));
  let total=0, acertos=0;
  dias.forEach(d=>{ const v=getQuestoesHoje(d); total+=v.total; acertos+=v.acertos; });
  return total>0 ? Math.round((acertos/total)*100) : null;
}
function finalizarQuestoesDoDia(dateStr){
  const qtd = getQuestoesHoje(dateStr).total;
  const tag = `${dateStr}:questoes`;
  if(qtd < QUESTOES_META){
    setTag(tag, 10, `Menos de ${QUESTOES_META} questões respondidas no dia (${qtd}/${QUESTOES_META})`, dateStr, 'caixinha', 'questoes');
  } else {
    setTag(tag, 0, '', dateStr);
  }
}
function renderQuestoesCard(dateStr){
  const info = getQuestoesHoje(dateStr);
  const pct = Math.min(100, Math.round((info.total/QUESTOES_META)*100));
  const acertoPct = info.total>0 ? Math.round((info.acertos/info.total)*100) : null;
  const mediaMes = computeAcertoMedioMes(dateStr.slice(0,7));
  return `<div class="card">
    <div class="section-title">📝 Questões do dia — meta ${QUESTOES_META}</div>

/* ---------- fechamento automático ---------- */
function finalizeDay(dateStr){
  const day = ensureWeekdayDay(dateStr);
  if(day.finalizado) return;
  ['treino',...STUDY_KEYS].forEach(key=>{
    if(day.items[key]==='pendente'){
      day.items[key]='nao_feito';
      const valor = key==='treino' ? 10 : studyPenaltyValue(dateStr);
      const label = key==='treino' ? 'Treino' : STUDY_LABELS[key];
      setTag(`${dateStr}:${key}`, valor, `${label} não feito (dia encerrado sem registro)`, dateStr, 'caixinha', key);
    }
  });
  REF_KEYS.forEach(key=>{
    const r = day.refeicoes[key];
    if(r.status==='pendente'){
      r.status='pulei';
      setTag(`${dateStr}:${key}`,10,`${REF_LABELS[key]} não registrada`,dateStr,'caixinha',key);
    }
  });
  if(day.agua.ml < AGUA_META){
    setTag(`${dateStr}:agua`,10,'Meta de água não batida no dia',dateStr,'caixinha','agua');
  } else { setTag(`${dateStr}:agua`,0,'',dateStr); }
  if(!day.items.trabalhoInicio || day.items.trabalhoInicio > '09:30'){
    setTag(`${dateStr}:trabalho`,10,'Trabalho iniciado depois das 09:30 (ou não registrado)',dateStr,'caixinha','trabalho');
  }
  if(!day.items.checkinFimDiaFeito){
    setTag(`${dateStr}:checkin`,10,'Check-in de fim de dia não feito',dateStr,'caixinha','checkin');
  }
  day.finalizado = true;
}
function finalizeWeekend(satKey){
  const wk = ensureWeekend(satKey);
  if(wk.finalizado) return;
  const it = wk.items;
  if(!it.quentinhas) setTag(`${satKey}:w_quentinhas`,10,'Não fez as quentinhas da semana',satKey,'caixinha','weekend_quentinhas');
  if(!it.mercado) setTag(`${satKey}:w_mercado`,10,'Não fez as compras do mercado',satKey,'caixinha','weekend_mercado');
  if(!it.agenda) setTag(`${satKey}:w_agenda`,10,'Não organizou a agenda da semana',satKey,'caixinha','weekend_agenda');
  if(!it.faxina) setTag(`${satKey}:w_faxina`,10,'Não fez a faxina do fim de semana',satKey,'caixinha','weekend_faxina');
  if(wk.treino==='pendente'){
    wk.treino = 'nao_feito';
    setTag(`${satKey}:treino`,10,'Treino de sábado não feito (dia encerrado sem registro)',satKey,'caixinha','weekend_treino');
  }
  wk.finalizado = true;
}
function evaluateOnLoad(){
  const today = todayStr();
  if(!state.lastEvaluatedDate){ state.lastEvaluatedDate = addDays(today,-1); }
  let cursor = addDays(state.lastEvaluatedDate,1);
  let guard = 0;
  while(cursor < today && guard < 3650){
    if(isWeekday(cursor)) finalizeDay(cursor);
    if(dayOfWeek(cursor)===0) finalizeWeekend(saturdayKeyFor(cursor));
    finalizarQuestoesDoDia(cursor);
    cursor = addDays(cursor,1); guard++;
  }
  const hm = nowHM();
  if(isWeekday(today) && hm>='22:00') finalizeDay(today);
  if(dayOfWeek(today)===0 && hm>='21:00') finalizeWeekend(saturdayKeyFor(today));
  if(hm>='22:00') finalizarQuestoesDoDia(today);
  state.lastEvaluatedDate = addDays(today,-1);
  save();
}

/* ---------- streak ---------- */
function computeStreak(){
  let streak = 0;
  let cursor = todayStr();
  const limite = state.appStartDate || todayStr();
  while(cursor >= limite){
    const temMulta = state.financas.gastos.some(g=>g.categoria==='caixinha' && g.data===cursor);
    if(temMulta) break;
    streak++;
    cursor = addDays(cursor,-1);
  }
  return streak;
}

function renderPesoChart(historico){
  if(historico.length < 2){
    return '<p class="empty-state">Registre pelo menos 2 pesagens pra ver o gráfico.</p>';
  }
  const W=320, H=140, padX=20, padY=20;
  const valores = historico.map(h=>h.valor);
  const min = Math.min(...valores), max = Math.max(...valores);
  const range = (max-min) || 1;
  const n = historico.length;
  const stepX = (W-padX*2)/(n-1);
  const pontos = historico.map((h,i)=>({
    x: padX + i*stepX,
    y: H-padY-((h.valor-min)/range)*(H-padY*2),
    valor: h.valor, data: h.data
  }));
  const linha = pontos.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `M${pontos[0].x.toFixed(1)},${H-padY} L${linha.split(' ').join(' L')} L${pontos[pontos.length-1].x.toFixed(1)},${H-padY} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" class="peso-chart" role="img" aria-label="Gráfico de evolução do peso">
    <path d="${area}" fill="var(--accent)" fill-opacity=".14"/>
    <polyline points="${linha}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pontos.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--accent-hi)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
  </svg>
  <div class="row-between" style="margin-top:2px;"><span>${formatBR(pontos[0].data)} · ${pontos[0].valor}kg</span><span>${formatBR(pontos[pontos.length-1].data)} · ${pontos[pontos.length-1].valor}kg</span></div>`;
}
function renderPesoCard(){
  const historico = state.peso.historico.slice().sort((a,b)=>a.data.localeCompare(b.data));
  const ultimo = historico.length ? historico[historico.length-1] : null;

  const variacao = (ultimo && primeiro) ? (ultimo.valor - primeiro.valor) : 0;

}

function getDisciplinasEsquecidas(){
  const porDisciplina = {};
  state.estudos.topicos.forEach(t=>{
    const d = getDisciplina(t.nome);
    if(!porDisciplina[d]) porDisciplina[d] = { pendentes:0, ultimoEstudo:null };
    if(!t.concluido) porDisciplina[d].pendentes++;
    if(t.concluidoEm && (!porDisciplina[d].ultimoEstudo || t.concluidoEm>porDisciplina[d].ultimoEstudo)){
      porDisciplina[d].ultimoEstudo = t.concluidoEm;
    }
  });
  const esquecidas = [];
  Object.entries(porDisciplina).forEach(([disciplina,info])=>{
    if(info.pendentes===0) return;
    const dias = info.ultimoEstudo ? diffDays(todayStr(), info.ultimoEstudo) : null;
    if(dias===null || dias>=5){
      esquecidas.push({ disciplina, dias });
    }
  });
  return esquecidas;
}
function deleteTopico(id){
  if(!confirm('Remover este tópico da lista?')) return;
  state.estudos.topicos = state.estudos.topicos.filter(t=>t.id!==id);
  save(); render();
}
function computeEstudosProgresso(){
  const total = state.estudos.topicos.length;
  const concluidos = state.estudos.topicos.filter(t=>t.concluido).length;
  return { total, concluidos, pct: total>0 ? Math.round((concluidos/total)*100) : 0 };
}
function getDisciplina(nome){
  const idx = nome.indexOf(':');
  return idx>=0 ? nome.slice(0,idx).trim() : 'Geral';
}
function getFilaIntercalada(){
  const pendentes = state.estudos.topicos.filter(t=>!t.concluido);
  const porDisciplina = {};
  const ordemDisciplinas = [];
  pendentes.forEach(t=>{
    const d = getDisciplina(t.nome);
    if(!porDisciplina[d]){ porDisciplina[d]=[]; ordemDisciplinas.push(d); }
    porDisciplina[d].push(t);
  });
  const resultado = [];
  let indice = 0;
  let restantes = pendentes.length;
  while(restantes>0 && ordemDisciplinas.length>0){
    const d = ordemDisciplinas[indice % ordemDisciplinas.length];
    const grupo = porDisciplina[d];
    if(grupo.length){
      resultado.push(grupo.shift());
      restantes--;
    }
    indice++;
  }
  return resultado;
}
function renderEstudos(){
  const hoje = getFilaIntercalada().slice(0, TOPICOS_POR_DIA);
  const { total, concluidos, pct } = computeEstudosProgresso();

  }

  html += `<div class="card"><div class="section-title">📚 Hoje você estuda isso</div>`;
  if(total===0){
    html += `<p class="empty-state">Nenhum tópico cadastrado ainda. Cole o conteúdo do edital abaixo pra começar.</p>`;
  } else if(hoje.length===0){
    html += `<p class="hint" style="margin-top:0;">🎉 Você zerou o edital. Todos os ${total} tópicos foram concluídos.</p>

    hoje.forEach(t=>{
      html += `<div class="checklist-item">

        <div class="checklist-label">${t.nome}</div>
      </div>`;
    });
    html += `<p class="hint">Marque como concluído pra liberar o próximo tópico da fila.</p>`;
  }
  html += `</div>`;

  if(total>0){
    html += `<div class="card"><div class="section-title">📈 Progresso do edital</div>
      <div class="row-between"><span>${concluidos} de ${total} tópicos${ciclos>0?` · 🔁 ciclo ${ciclos+1}`:''}</span><span>${pct}%</span></div>
      <div class="progress"><div class="progress-fill good" style="width:${pct}%"></div></div>
      <p class="hint">${state.estudos.totalConcluidosHistorico||0} tópicos estudados no total, contando revisões.</p>
    </div>`;
  }

  html += renderQuestoesCard(todayStr());

  html += `<div class="card"><div class="section-title">📋 Conteúdo do edital</div>
    <p class="hint" style="margin-top:0;">Cole o conteúdo do edital, um tópico por linha, e a fila se organiza sozinha.</p>
    <form id="form-topicos-bulk">
      <textarea name="conteudo" rows="4" placeholder="Língua Portuguesa: interpretação de texto&#10;Direito Administrativo: atos administrativos&#10;Raciocínio Lógico: proposições"></textarea>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Adicionar à fila</button>
    </form>
  </div>`;

  if(total>0){
    html += `<div class="card"><div class="section-title">📑 Lista completa (${concluidos}/${total})</div>`;
    state.estudos.topicos.forEach(t=>{
      html += `<div class="checklist-item">
        <div class="checkbox ${t.concluido?'checked':''}" data-action="topico-toggle" data-id="${t.id}">${t.concluido?'✓':''}</div>
        <div class="checklist-label" style="${t.concluido?'text-decoration:line-through;opacity:.5;':''}">${t.nome}</div>
        <button class="btn btn-secondary fixo-del" data-action="topico-delete" data-id="${t.id}">✕</button>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

/* ---------- financeiro ---------- */
function computeSaldoCaixinhaAtual(){
  const hist = state.caixinha.historicoQuitacoes;
  const lastQ = hist.length ? hist[hist.length-1].data : null;
  return state.financas.gastos.filter(g=>g.categoria==='caixinha' && (!lastQ || g.data>lastQ)).reduce((s,g)=>s+g.valor,0);
}
function computeMonthStats(yyyymm){
  const list = state.financas.gastos.filter(g=>g.data.startsWith(yyyymm));
  const porCategoria = {};
  list.forEach(g=>{ porCategoria[g.categoria] = (porCategoria[g.categoria]||0) + g.valor; });
  const total = list.reduce((s,g)=>s+g.valor,0);
  return { porCategoria, total };
}
function computeProjecaoEconomia(){
  if(!state.config.contestDate) return null;
  const diasDesdeInicio = Math.max(1, diffDays(todayStr(), state.appStartDate));
  const totalAcumulado = state.financas.gastos.filter(g=>g.categoria==='caixinha').reduce((s,g)=>s+g.valor,0);
  const mediaDiaria = totalAcumulado / diasDesdeInicio;
  const diasAteProva = diffDays(state.config.contestDate, todayStr());
  if(diasAteProva<0) return null;
  const projecao = totalAcumulado + (mediaDiaria * diasAteProva);
  return { mediaDiaria, diasAteProva, projecao, inscricoes: Math.floor(projecao/INSCRICAO_VALOR) };
}
function computeComparativoMensal(){
  const hoje = todayStr();
  const mesAtual = hoje.slice(0,7);
  const mesPassado = addDays(mesAtual+'-01',-1).slice(0,7);
  const atual = computeMonthStats(mesAtual);
  const passado = computeMonthStats(mesPassado);
  return { atual: atual.total, passado: passado.total, delta: atual.total - passado.total };
}
function computeDeliveryStats(yyyymm){
  const list = state.financas.gastos.filter(g=>g.data.startsWith(yyyymm));
  const pedidos = list.filter(g=>g.origem==='ifood'||g.origem==='ifood_combo').length;
  const multas = list.filter(g=>g.origem==='ifood'||g.origem==='ifood_combo').reduce((s,g)=>s+g.valor,0);
  const gastoReal = list.filter(g=>g.categoria==='delivery').reduce((s,g)=>s+g.valor,0);
  const impactoTotal = multas + gastoReal;
  return { pedidos, multas, gastoReal, impactoTotal, inscricoesPerdidas: Math.floor(impactoTotal/INSCRICAO_VALOR) };
}
function computeWeekStats(startStr, endStr){
  let treinoOk=0, treinoTot=0, estudoOk=0, estudoTot=0, refOk=0, refTot=0, trabOk=0, trabTot=0;
  let cursor = startStr;
  while(cursor <= endStr){
    if(isWeekday(cursor) && state.days[cursor]){
      const d = state.days[cursor];
      treinoTot++; if(d.items.treino==='feito') treinoOk++;
      STUDY_KEYS.forEach(k=>{ estudoTot++; if(d.items[k]==='feito') estudoOk++; });
      REF_KEYS.forEach(k=>{ refTot++; if(d.refeicoes[k].status==='feito') refOk++; });
      trabTot++; if(d.items.trabalhoInicio && d.items.trabalhoInicio<='09:30') trabOk++;
    }
    cursor = addDays(cursor,1);
  }
  cursor = startStr;
  while(cursor <= endStr){
    if(dayOfWeek(cursor)===6 && state.weekends[cursor]){
      treinoTot++; if(state.weekends[cursor].treino==='feito') treinoOk++;
    }
    cursor = addDays(cursor,1);
  }
  let preparoPct = null;
  const satInRange = [];
  cursor = startStr;
  while(cursor<=endStr){ if(dayOfWeek(cursor)===6) satInRange.push(cursor); cursor=addDays(cursor,1); }
  if(satInRange.length && state.weekends[satInRange[0]]){
    const items = state.weekends[satInRange[0]].items;
    const vals = Object.values(items);
    preparoPct = (vals.filter(Boolean).length / vals.length) * 100;
  }
  let questoesOk=0, questoesTot=0;
  cursor = startStr;
  while(cursor <= endStr){
    questoesTot++; if(getQuestoesHoje(cursor).total>=QUESTOES_META) questoesOk++;
    cursor = addDays(cursor,1);
  }
  const totalMultas = state.financas.gastos.filter(g=>g.categoria==='caixinha' && g.data>=startStr && g.data<=endStr).reduce((s,g)=>s+g.valor,0);
  const pct = (ok,tot)=> tot>0 ? (ok/tot)*100 : null;
  const parts = [pct(treinoOk,treinoTot), pct(estudoOk,estudoTot), pct(refOk,refTot), pct(trabOk,trabTot), preparoPct, pct(questoesOk,questoesTot)].filter(v=>v!==null);
  const overallPct = parts.length ? parts.reduce((a,b)=>a+b,0)/parts.length : 100;
  return {
    treinoPct: pct(treinoOk,treinoTot) ?? 0,
    estudoPct: pct(estudoOk,estudoTot) ?? 0,
    alimentacaoPct: pct(refOk,refTot) ?? 0,
    trabalhoPct: pct(trabOk,trabTot) ?? 0,
    questoesPct: pct(questoesOk,questoesTot) ?? 0,
    preparoPct, overallPct, totalMultas
  };
}

  if(saldo<=0){ toastSimple('A caixinha já está zerada.'); return; }
  if(!confirm(`Quitar caixinha de ${brl(saldo)}? Isso zera o saldo e registra a data do pagamento. Destino: ${state.config.caixinhaDestino}`)) return;
  state.caixinha.historicoQuitacoes.push({ id:uid(), data:todayStr(), valor:saldo });

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `caixinha-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed!=='object' || !('financas' in parsed)) throw new Error('formato inválido');
      if(!confirm('Importar este backup vai substituir todos os dados atuais. Continuar?')) return;
      state = Object.assign(defaultState(), parsed);
      save(); render();
      toastSimple('Backup importado com sucesso.');
    }catch(e){ alert('Não foi possível importar: arquivo inválido.'); }
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!confirm('Isso apaga TODOS os dados (rotina, caixinha, financeiro). Tem certeza?')) return;
  if(!confirm('Confirma de novo: apagar tudo e começar do zero?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  save(); render();
}
function ativarNotificacoes(){
  if(!('Notification' in window)){ alert('Este navegador não suporta notificações.'); return; }
  Notification.requestPermission().then(perm=>{
    state.config.notificacoesAtivas = perm==='granted';
    save(); render();
  });

      <div class="btn-ghost-row" style="margin-top:12px;">
        <button class="btn" data-action="agua-add" data-ml="250">+250ml</button>
        <button class="btn" data-action="agua-add" data-ml="500">+500ml</button>
        <button class="btn btn-secondary" data-action="agua-add" data-ml="-250">-250ml</button>
      </div>
      ${(hm>='18:00' && pct<70) ? '<div class="hint" style="color:var(--danger);margin-top:10px;">São 18h e você NÃO BATEU 70% da água. VOCÊ TEM QUE resolver isso agora, sem desculpa.</div>' : ''}
    </div>`;

    html += `<div class="card"><div class="section-title">🍽️ Refeições</div>`;
    REF_KEYS.forEach(k=>{
      const r = day.refeicoes[k];
      html += `<div class="item-row" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="item-info"><div class="item-label">${REF_LABELS[k]}</div><div class="item-time">${REF_TIMES[k]}</div>${statusPill(r.status==='pulei'?'pulei':r.status)}</div>
          <div class="segmented">
            <button class="seg-btn ${r.status==='feito'?'on-ok':''}" data-action="ref-status" data-key="${k}" data-status="feito">Fiz</button>
            <button class="seg-btn ${r.status==='pulei'?'on-bad':''}" data-action="ref-status" data-key="${k}" data-status="pulei">Pulei</button>
          </div>
        </div>
        <textarea placeholder="Observação (opcional)" data-action="ref-obs" data-key="${k}">${r.obs||''}</textarea>
      </div>`;
    });
    html += `</div>`;

    html += `<div class="card"><div class="section-title">💼 Trabalho</div>`;
    if(day.items.trabalhoInicio){
      const late = day.items.trabalhoInicio > '09:30';
      html += `<p class="muted">Início registrado às <strong style="color:var(--text)">${day.items.trabalhoInicio}</strong> ${late?'<span class="pill pill-bad">❌ atrasado</span>':'<span class="pill pill-ok">✅ no horário</span>'}</p>
      <button class="btn btn-secondary btn-block" data-action="trabalho-registrar">Corrigir horário (registrar agora)</button>`;
    } else {
      html += `<p class="muted">VOCÊ TEM QUE começar até 09:30. Sem exceção.</p><button class="btn btn-primary btn-block" data-action="trabalho-registrar">Registrar início do trabalho</button>`;
    }
    html += `</div>`;

    html += `<div class="card"><div class="section-title">🌙 Fim de dia</div>`;
    if(day.finalizado){
      const totalHoje = state.financas.gastos.filter(g=>g.data===today && g.categoria==='caixinha').reduce((s,g)=>s+g.valor,0);
      html += `<p class="muted">Dia encerrado. Multas de hoje: <strong style="color:var(--text)">${brl(totalHoje)}</strong></p>
      <button class="btn btn-secondary btn-block" data-action="ver-resumo-dia" data-date="${today}">Ver resumo do dia</button>`;
    } else {
      html += `<p class="muted">VOCÊ TEM QUE fazer o check-in até 22h. Sem ele, o dia se fecha sozinho — e sozinho ele não perdoa nada pendente.</p>
      <button class="btn btn-primary btn-block" data-action="checkin-fazer">Fazer check-in de fim de dia</button>`;
    }
    html += `</div>`;
  } else {
    const satKey = saturdayKeyFor(today);
    const wk = ensureWeekend(satKey);
    const pendentesCriticos = WEEKEND_ITEMS.filter(i=>i.penalized && !wk.items[i.key]);
    if(!wk.finalizado && pendentesCriticos.length){
      html += `<div class="banner-warn">Faltam ${pendentesCriticos.length} ${pendentesCriticos.length>1?'itens':'item'}. VOCÊ TEM QUE terminar até domingo às 21h — depois disso a multa é automática.</div>`;
      if(pendentesCriticos.some(i=>i.key==='quentinhas')) html += `<div class="msg-banner">VOCÊ TEM QUE preparar as marmitas. Sem isso, segunda-feira vai ser iFood ou fome — e você vai pagar pelos dois.</div>`;
      if(pendentesCriticos.some(i=>i.key==='mercado')) html += `<div class="msg-banner">VOCÊ TEM QUE fazer o mercado agora. Sem isso, a semana já começa errada antes de começar.</div>`;
      if(isSun && pendentesCriticos.some(i=>i.key==='agenda')) html += `<div class="msg-banner">VOCÊ TEM QUE organizar a agenda hoje. Domingo sem isso = segunda sem direção — custa R$10 e muito mais em energia perdida.</div>`;
    }
    html += `<div class="card"><div class="section-title">🧹 Checklist do fim de semana</div>`;
    WEEKEND_ITEMS.forEach(i=>{
      const checked = wk.items[i.key];
      html += `<div class="checklist-item">
        <div class="checkbox ${checked?'checked':''}" data-action="fds-toggle" data-sat="${satKey}" data-key="${i.key}">${checked?'✓':''}</div>
        <div class="checklist-label ${i.penalized?'penalized':''}">${i.label}</div>
      </div>`;
    });
    html += `</div>`;
    if(wk.finalizado){
      const sunKey = addDays(satKey,1);
      const pens = state.financas.gastos.filter(g=> g.origem && g.origem.startsWith('weekend_') && g.data>=satKey && g.data<=sunKey);
      html += `<div class="card"><div class="section-title">Resultado do fim de semana</div>${pens.length? `<ul class="modal-list">${pens.map(g=>`<li><span>${g.nota}</span><strong>${brl(g.valor)}</strong></li>`).join('')}</ul>` : '<p class="muted">Nenhuma multa de fim de semana. ✅</p>'}</div>`;
    }
  }

  html += `<div class="card"><button class="btn btn-danger btn-block" data-action="ifood-open" data-date="${today}">🍕 Registrar pedido de iFood</button></div>`;
  return html;
}

function renderTreino(){
  const today = todayStr();
  const wd = isWeekday(today);
  const isSat = dayOfWeek(today)===6;
  let html = '';
  if(wd || isSat){
    const treinoStatus = wd ? ensureWeekdayDay(today).items.treino : ensureWeekend(today).treino;
    const tipoTreino = wd ? ensureWeekdayDay(today).items.tipoTreino : ensureWeekend(today).tipoTreino;
    html += renderTreinoCard(treinoStatus, today, tipoTreino);
  } else {
    html += `<div class="card"><p>Domingo é descanso de treino oficial. Se quiser fazer algo leve por conta própria, fique à vontade — mas não é obrigatório nem penalizado.</p></div>`;
  }
  html += renderCorrelacaoCard();
  html += renderPesoCard();
  return html;
}

function renderFinancas(){
  const saldo = computeSaldoCaixinhaAtual();
  const monday = fmtDate(mondayOf(new Date()));
  const today = todayStr();
  const semanaTotal = state.financas.gastos.filter(g=>g.categoria==='caixinha' && g.data>=monday && g.data<=today).reduce((s,g)=>s+g.valor,0);
  const mesAtual = today.slice(0,7);
  const mesTotal = state.financas.gastos.filter(g=>g.categoria==='caixinha' && g.data.startsWith(mesAtual)).reduce((s,g)=>s+g.valor,0);
  const historico = state.financas.gastos.filter(g=>g.categoria==='caixinha').sort((a,b)=> b.data.localeCompare(a.data)).slice(0,40);

  let html = `<div class="card">
    <div class="hero-saldo"><div class="valor">${brl(saldo)}</div><div class="sub">saldo atual da caixinha</div></div>
    <div class="stat-row">
      <div class="stat-box"><div class="num">${brl(semanaTotal)}</div><div class="lbl">esta semana</div></div>
      <div class="stat-box"><div class="num">${brl(mesTotal)}</div><div class="lbl">este mês</div></div>
      <div class="stat-box"><div class="num">🔥 ${computeStreak()}</div><div class="lbl">streak</div></div>
    </div>
  </div>`;

  const projecao = computeProjecaoEconomia();
  if(projecao){
    html += `<div class="card"><div class="section-title">🎯 Projeção pra taxa de inscrição</div>

    </div>`;
  }

  html += `<div class="card"><div class="section-title">🎯 Destino do dinheiro</div>
    <textarea data-action="config-field" data-field="caixinhaDestino">${state.config.caixinhaDestino}</textarea>
    <p class="hint">Esse dinheiro é para a taxa de inscrição do próximo concurso — UFAL/IFAL.</p>
  </div>`;

  html += `<div class="card"><button class="btn btn-primary btn-block" data-action="quitar-caixinha">Quitar caixinha (${brl(saldo)})</button></div>`;

  html += `<div class="card"><div class="section-title">💭 Quanto você teria poupado</div>
    <p class="muted">Se tivesse cumprido 100% da rotina este mês, teria <strong style="color:var(--success)">${brl(mesTotal)}</strong> a mais guardado. Cada multa foi uma escolha sua, não um acidente.</p>
  </div>`;

  html += `<div class="card"><div class="section-title">📜 Histórico de multas</div>`;
  if(historico.length){
    html += historico.map(g=>`<div class="despesa-item"><div class="despesa-info">${g.nota}<div class="despesa-cat">${formatBR(g.data)}</div></div><strong style="color:var(--danger)">${brl(g.valor)}</strong></div>`).join('');
  } else {
    html += `<p class="empty-state">Nenhuma multa registrada ainda. Continue assim.</p>`;
  }
  html += `</div>`;

  if(state.caixinha.historicoQuitacoes.length){
    html += `<div class="card"><div class="section-title">✅ Quitações anteriores</div>`;
    html += state.caixinha.historicoQuitacoes.slice().reverse().map(q=>`<div class="despesa-item"><div class="despesa-info">Quitação em ${formatBR(q.data)}</div><strong>${brl(q.valor)}</strong></div>`).join('');
    html += `</div>`;
  }

  const stats = computeMonthStats(mesAtual);
  const deliv = computeDeliveryStats(mesAtual);
  const meta = state.config.metaEconomiaMensal;
  const metaPct = meta>0 ? Math.min(100, Math.round((saldo/meta)*100)) : 0;
  const maxCat = Math.max(1, ...Object.values(stats.porCategoria));
  const comparativo = computeComparativoMensal();

  html += `<div class="card">
    <div class="section-title">➕ Registrar gasto</div>
    <form id="form-despesa">
      <label>Categoria</label>
      <select name="categoria" required>${EXPENSE_CATEGORIES.map(c=>`<option value="${c.key}">${c.label}</option>`).join('')}</select>
      <label>Valor (R$)</label>
      <input type="number" name="valor" min="0" step="0.01" required placeholder="0,00">
      <label>Observação</label>
      <input type="text" name="nota" placeholder="opcional">
      <label>Data</label>
      <input type="date" name="data" value="${today}">
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:12px;">Adicionar</button>
    </form>
    <p class="hint">Pedido de iFood? Use o botão 🍕 na aba Hoje — ele já lança a multa junto.</p>
  </div>`;

  html += renderGastosFixosCard();

  html += `<div class="card"><div class="section-title">📊 Resumo do mês</div>
    <div class="comparativo-row"><span>Este mês</span><strong style="color:var(--text)">${brl(comparativo.atual)}</strong></div>
    <div class="comparativo-row"><span>Mês passado</span><strong style="color:var(--muted)">${brl(comparativo.passado)}</strong></div>
    <div class="comparativo-row"><span>${comparativo.delta>0?'Gastou mais':comparativo.delta<0?'Gastou menos':'Igual ao mês passado'}</span><strong style="color:${comparativo.delta>0?'var(--danger)':comparativo.delta<0?'var(--success)':'var(--text-dim)'}">${comparativo.delta>0?'+':''}${brl(comparativo.delta)}</strong></div>
    <div class="divider"></div>`;
  const catsToShow = [...EXPENSE_CATEGORIES.map(c=>c.key), 'delivery', 'caixinha', 'fixos'];
  const anyExpense = catsToShow.some(k=>stats.porCategoria[k]);
  if(anyExpense){
    catsToShow.forEach(key=>{
      const val = stats.porCategoria[key]||0;
      if(!val) return;
      const pct = Math.round((val/maxCat)*100);
      html += `<div class="bar-row"><div class="barrow-label"><span>${ALL_CATEGORY_LABELS[key]}</span><span>${brl(val)}</span></div><div class="progress"><div class="progress-fill ${key==='caixinha'||key==='delivery'?'bad':key==='estudos'?'good':''}" style="width:${pct}%"></div></div></div>`;
    });
    html += `<p class="muted" style="margin-top:6px;">Total do mês: <strong style="color:var(--text)">${brl(stats.total)}</strong></p>`;
  } else {
    html += `<p class="empty-state">Nenhum gasto registrado neste mês ainda.</p>`;
  }
  html += `</div>`;

  html += `<div class="card"><div class="section-title">🍕 Delivery tracker</div>
    <div class="stat-row">
      <div class="stat-box"><div class="num">${deliv.pedidos}</div><div class="lbl">pedidos</div></div>
      <div class="stat-box"><div class="num">${brl(deliv.gastoReal)}</div><div class="lbl">gasto real</div></div>
      <div class="stat-box"><div class="num">${brl(deliv.multas)}</div><div class="lbl">multas</div></div>
    </div>
    <p class="hint" style="margin-top:10px;">${deliv.impactoTotal>0 ? `VOCÊ GASTOU ${brl(deliv.impactoTotal)} com delivery este mês (gasto + multa). São ${deliv.inscricoesPerdidas} taxa(s) de inscrição de concurso (R$${INSCRICAO_VALOR}) que você jogou fora.` : 'Você NÃO pediu delivery este mês. Isso é disciplina real — não estrague agora.'}</p>
  </div>`;

  html += `<div class="card"><div class="section-title">🎯 Meta de economia mensal</div>
    <input type="number" data-action="config-field" data-field="metaEconomiaMensal" value="${meta||''}" placeholder="ex: 300" min="0" step="1">
    ${meta>0 ? `<div class="row-between" style="margin-top:12px;"><span>${brl(saldo)}</span><span>${metaPct}%</span></div><div class="progress"><div class="progress-fill good" style="width:${metaPct}%"></div></div><p class="hint">Multas + economia guardada este mês vs. sua meta.</p>` : '<p class="hint">Defina uma meta pra ver a barra de progresso.</p>'}
  </div>`;

  const listaMes = state.financas.gastos.filter(g=>g.data.startsWith(mesAtual)).sort((a,b)=>b.data.localeCompare(a.data));
  html += `<div class="card"><div class="section-title">🧾 Lançamentos do mês</div>`;
  if(listaMes.length){
    html += listaMes.map(g=>`<div class="despesa-item"><div class="despesa-info">${g.nota||ALL_CATEGORY_LABELS[g.categoria]}<div class="despesa-cat">${ALL_CATEGORY_LABELS[g.categoria]} · ${formatBR(g.data)}</div></div><div style="display:flex;align-items:center;gap:8px;"><strong>${brl(g.valor)}</strong><button class="btn btn-secondary" data-action="delete-despesa" data-id="${g.id}">✕</button></div></div>`).join('');
  } else {
    html += `<p class="empty-state">Nada lançado neste mês.</p>`;
  }
  html += `</div>`;

  return html;
}

function renderAjustes(){

  const modoAtivo = contest && isModoConcurso(todayStr());
  const diasRestantes = contest ? diffDays(contest, todayStr()) : null;

  let html = `<div class="card"><div class="section-title">🎓 Modo concurso</div>
    <label>Data da prova</label>
    <input type="date" data-action="config-field" data-field="contestDate" value="${contest||''}">
    ${contest ? (modoAtivo ? `<div class="badge-fire" style="margin-top:10px;">🔥 Modo concurso ativo (faltam ${diasRestantes} dias) — estudo pulado custa R$20</div>` : `<p class="hint">Faltam ${diasRestantes} dia(s) para a prova. Modo concurso ativa nos últimos 30 dias.</p>`) : '<p class="hint">Configure a data da prova para ativar multas de estudo maiores nos 30 dias antes.</p>'}
  </div>`;

  html += `<div class="card"><div class="section-title">📊 Resumo semanal</div>
    <button class="btn btn-secondary btn-block" data-action="ver-resumo-semana">Ver resumo da semana atual</button>
  </div>`;

  html += `<div class="card"><div class="section-title">🔔 Notificações</div>
    <p class="hint">Lembretes nos horários da rotina — funcionam apenas enquanto o app estiver aberto (mesmo em segundo plano) no navegador. Um PWA sem servidor não consegue enviar push com o app fechado.</p>
    <button class="btn ${state.config.notificacoesAtivas?'btn-success':'btn-primary'} btn-block" data-action="notif-ativar">${state.config.notificacoesAtivas?'Notificações ativadas ✅':'Ativar lembretes'}</button>
  </div>`;

  if(deferredInstallPrompt){
    html += `<div class="card"><div class="section-title">📲 Instalar app</div><button class="btn btn-primary btn-block" data-action="instalar-app">Adicionar à tela inicial</button></div>`;
  } else {
    html += `<div class="card"><div class="section-title">📲 Instalar app</div><p class="hint">Android/Chrome: menu ⋮ → "Adicionar à tela inicial". iPhone/Safari: botão compartilhar → "Adicionar à Tela de Início".</p></div>`;
  }

  html += `<div class="card"><div class="section-title">💾 Backup dos dados</div>
    <p class="hint">Tudo fica salvo só neste navegador (localStorage). Exporte de vez em quando pra não perder o histórico.</p>
    <div class="btn-ghost-row">
      <button class="btn btn-secondary" style="flex:1;" data-action="exportar-dados">Exportar</button>
      <label class="btn btn-secondary" style="flex:1;text-align:center;">Importar<input type="file" accept="application/json" data-action="import-file" style="display:none;"></label>
    </div>
  </div>`;

  html += `<div class="card"><div class="section-title">⚠️ Zona de risco</div>
    <button class="btn btn-danger btn-block" data-action="apagar-dados">Apagar todos os dados</button>
  </div>`;

  return html;
}

function renderTab(tab){
  if(tab==='hoje') return renderHoje();
  if(tab==='treino') return renderTreino();
  if(tab==='estudos') return renderEstudos();
  if(tab==='financas') return renderFinancas();
  if(tab==='ajustes') return renderAjustes();
  return '';
}
function navButton(tab, icon, label){
  return `<button class="navbtn ${activeTab===tab?'active':''}" data-action="nav" data-tab="${tab}"><span class="ic-wrap"><span class="ic">${icon}</span></span><span>${label}</span></button>`;

function renderApp(){

function render(){
  const prev = document.getElementById('tab-content');

  document.getElementById('app').innerHTML = renderApp();

  if(next) next.scrollTop = scrollTop;

/* ---------- eventos ---------- */
document.addEventListener('click', (e)=>{
  const backdrop = e.target.closest('.modal-backdrop');
  if(backdrop && e.target===backdrop){ closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset;
  switch(a.action){
    case 'nav': activeTab = a.tab; render(); break;
    case 'day-status': toggleEstudo(todayStr(), a.key, a.status); break;
    case 'treino-status': toggleTreinoUnified(a.date, a.status); break;
    case 'treino-tipo': setTreinoTipo(a.date, a.tipo); break;
    case 'ref-status': toggleRefeicao(todayStr(), a.key, a.status); break;
    case 'agua-add': addAgua(todayStr(), Number(a.ml)); break;
    case 'ciclo-reiniciar': reiniciarCicloEdital(); break;
    case 'trabalho-registrar': registrarTrabalho(todayStr()); break;
    case 'checkin-fazer': doCheckinFimDia(todayStr()); break;
    case 'ver-resumo-dia': openDaySummaryModal(a.date); break;
    case 'ifood-open': openIfoodModal(a.date); break;
    case 'ifood-confirm': {
      const valorEl = document.getElementById('ifood-valor');
      const mealEl = document.getElementById('ifood-meal');
      registrarIfood(a.date, valorEl?Number(valorEl.value)||0:0, mealEl?(mealEl.value||null):null);
      break;
    }
    case 'fds-toggle': toggleWeekendItem(a.sat, a.key); break;
    case 'quitar-caixinha': quitarCaixinha(); break;
    case 'modal-close': closeModal(); break;
    case 'ver-resumo-semana': {
      const monday = fmtDate(mondayOf(new Date()));
      const statsAnterior = computeWeekStats(addDays(monday,-7), addDays(monday,-1));
      openWeeklySummaryModal(computeWeekStats(monday, todayStr()), 'Resumo da semana atual', statsAnterior);
      break;
    }
    case 'exportar-dados': exportData(); break;
    case 'apagar-dados': resetAll(); break;
    case 'delete-despesa': deleteDespesa(a.id); break;
    case 'fixo-toggle-pago': toggleFixoPago(a.id); break;
    case 'fixo-delete': deleteGastoFixo(a.id); break;
    case 'topico-toggle': toggleTopicoConcluido(a.id); break;
    case 'topico-delete': deleteTopico(a.id); break;
    case 'notif-ativar': ativarNotificacoes(); break;
    case 'instalar-app':
      if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); deferredInstallPrompt=null; }
      break;
  }
});
document.addEventListener('change', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset;
  if(a.action==='ref-obs') updateRefObs(todayStr(), a.key, el.value);
  if(a.action==='config-field') updateConfig(a.field, el.value);
  if(a.action==='import-file') handleImportFile(el.files[0]);
  if(a.action==='fixo-valor') updateGastoFixoValor(a.id, el.value);
});
document.addEventListener('submit', (e)=>{
  const form = e.target;
  if(form.id==='form-despesa'){
    e.preventDefault();
    addDespesaManual(form.categoria.value, Number(form.valor.value), form.nota.value, form.data.value||todayStr());
    form.reset();
  }
  if(form.id==='form-peso'){
    e.preventDefault();
    registrarPeso(todayStr(), Number(form.valor.value));
    form.reset();
  }
  if(form.id==='form-fixo'){
    e.preventDefault();
    addGastoFixo(form.nome.value, form.valor.value);
    form.reset();
  }
  if(form.id==='form-topicos-bulk'){
    e.preventDefault();
    addTopicos(form.conteudo.value);
    form.reset();
  }
  if(form.id==='form-questoes'){
    e.preventDefault();
    registrarRodadaQuestoes(todayStr(), Number(form.totalRodada.value), Number(form.acertosRodada.value));
    form.reset();
  }
  if(form.dataset.actionForm==='carga'){
    e.preventDefault();
    registrarCarga(form.dataset.exercicio, form.carga.value);
    form.reset();
  }
});

/* ---------- lembretes (melhor esforço, app aberto) ---------- */
const ROTINA_LEMBRETES = [
  {time:'05:00',msg:'Acordar + água (500ml) 🐯'},
  {time:'05:30',msg:'Hora do treino'},
  {time:'08:00',msg:'Café da manhã'},
  {time:'09:00',msg:'Início do trabalho'},
  {time:'12:00',msg:'Almoço'},
  {time:'18:00',msg:'Jantar + início do bloco de estudo'},
  {time:'18:30',msg:'Bloco de estudo 1 — Gran Cursos'},
  {time:'19:30',msg:'Bloco de estudo 2 — Gran Cursos'},
  {time:'20:30',msg:'Bloco de estudo 3 — questões/simulado'},
  {time:'22:00',msg:'Check-in de fim de dia'}
];
let lastFiredMinute = null;
function checkLembretes(){
  if(!state.config.notificacoesAtivas || !('Notification' in window) || Notification.permission!=='granted') return;
  const today = todayStr();
  if(!isWeekday(today)) return;
  const hm = nowHM();
  if(hm===lastFiredMinute) return;
  const item = ROTINA_LEMBRETES.find(r=>r.time===hm);
  if(item){
    lastFiredMinute = hm;
    try{ new Notification('🐯 Caixinha de Castigo', {body:item.msg}); }catch(e){}
  }
}

/* ---------- resumo semanal automático (segunda) ---------- */
function checkWeeklySummaryAndShow(){
  const today = new Date();
  if(today.getDay()===1){
    const thisMonday = fmtDate(mondayOf(today));
    if(state.weeklySummaryLastShownWeek !== thisMonday){
      const prevMonday = addDays(thisMonday,-7);
      const prevSunday = addDays(thisMonday,-1);
      const stats = computeWeekStats(prevMonday, prevSunday);
      const statsAnterior = computeWeekStats(addDays(prevMonday,-7), addDays(prevMonday,-1));
      state.weeklySummaryLastShownWeek = thisMonday;
      save();
      openWeeklySummaryModal(stats, 'Resumo da semana passada', statsAnterior);
    }
  }
}

/* ---------- init ---------- */
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredInstallPrompt = e; render(); });

document.addEventListener('DOMContentLoaded', ()=>{
  state = load();
  if(!state.appStartDate){ state.appStartDate = todayStr(); save(); }
  ensureGastosFixosSeed();
  evaluateOnLoad();
  render();
  checkWeeklySummaryAndShow();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  setInterval(()=>{ evaluateOnLoad(); checkLembretes(); render(); }, 60000);
});
</script>
